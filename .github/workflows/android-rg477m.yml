name: Android APK (RG477M)

on:
  workflow_dispatch:
  push:
    branches:
      - rg477m-android

permissions:
  contents: read
  actions: write

concurrency:
  group: opennv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      GODOT_RELEASE: 4.8-dev7
      GODOT_TEMPLATES: 4.8.dev7.mono
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot Mono and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q godot.zip
          bin=$(find "$PWD" -type f -name "Godot_v*_mono_linux*.x86_64" | head -1)
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATES"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          cp -r tpl/templates/* "$dest"/
          ls "$dest" | grep -i android
          ver=$(echo $GODOT_RELEASE | cut -d- -f1)
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-$ver.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-$ver.tres"

      - name: Native audio for arm64
        run: |
          set -e
          sdk="$RUNNER_TEMP/audio-sdk"; mkdir -p "$sdk" && cd "$sdk"
          "$GODOT" --headless --dump-gdextension-interface --quit
          ndk=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p "$GITHUB_WORKSPACE/runtime/generated/native"
          "$ndk/aarch64-linux-android29-clang++" -std=c++17 -O2 -fPIC -shared -static-libstdc++ \
            -Wall -Wextra -Werror -I"$sdk" "$GITHUB_WORKSPACE/runtime/native/audio/opennv_audio.cpp" \
            -o "$GITHUB_WORKSPACE/runtime/generated/native/libopennv_audio.so"
          "$ndk/llvm-strip" "$GITHUB_WORKSPACE/runtime/generated/native/libopennv_audio.so"
          # the editor loads the extension for itself before it packs the Android library
          g++ -std=c++17 -O2 -fPIC -shared -Wall -Wextra -Werror -I"$sdk" \
            "$GITHUB_WORKSPACE/runtime/native/audio/opennv_audio.cpp" \
            -o "$GITHUB_WORKSPACE/runtime/generated/native/libopennv_audio.linux.so"

      - name: Import and export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/android/rg477m-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          cd runtime
          "$GODOT" --headless --path . --import || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$GODOT" --headless --path . --export-debug "Android RG477M" "$GITHUB_WORKSPACE/out/opennv-477m.apk" 2>&1 | tee export.log
          test -s "$GITHUB_WORKSPACE/out/opennv-477m.apk"
          unzip -l "$GITHUB_WORKSPACE/out/opennv-477m.apk" > apk.txt
          grep -E "lib/arm64|OpenNV\.dll|\.pck" apk.txt
          grep -q "lib/arm64-v8a/libopennv_audio.so" apk.txt
          grep -q "/OpenNV.dll" apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: opennv-477m-arm64
          path: out/opennv-477m.apk

      - name: Keep only the newest build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" -w "Android APK (RG477M)" -L 50 --json databaseId \
            --jq ".[].databaseId | select(. != ${{ github.run_id }})" | while read -r id; do
            gh run delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
